<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>えいごクエスト</title>
<style>
  :root{
    --ink:#1b1b1b; --paper:#f6f0dc; --panel:#3b2a1a; --panel2:#5a4128;
    --grass:#4caf3a; --grass-d:#2f7d23; --dirt:#8a5a2b; --sky:#4aa3f0;
    --gold:#ffcf3a; --red:#e2403a; --blue:#2f6fd6; --ok:#36c24a; --ng:#e2403a;
    --px:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#111;color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  ruby rt{font-size:.5em;}

  .screen{position:fixed;inset:0;display:none;}
  .screen.active{display:flex;}

  /* ドット絵ふうの枠 */
  .px-box{background:var(--paper);border:var(--px) solid var(--ink);
    box-shadow:inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.18), inset var(--px) var(--px) 0 rgba(255,255,255,.7);}
  .px-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;
    background:var(--grass);color:#fff;font-weight:900;letter-spacing:.05em;
    border:var(--px) solid var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.45);
    box-shadow:inset -6px -6px 0 var(--grass-d), inset 6px 6px 0 rgba(255,255,255,.35);
    padding:.55em 1.2em;min-height:56px;transition:transform .05s;}
  .px-btn:active{transform:translateY(3px);box-shadow:inset -3px -3px 0 var(--grass-d), inset 3px 3px 0 rgba(255,255,255,.35);}
  .px-btn.gray{background:#8d8d8d;box-shadow:inset -6px -6px 0 #5e5e5e, inset 6px 6px 0 rgba(255,255,255,.35);}
  .px-btn.blue{background:var(--blue);box-shadow:inset -6px -6px 0 #1d4a96, inset 6px 6px 0 rgba(255,255,255,.35);}
  .px-btn:disabled{filter:grayscale(1) brightness(.85);}

  /* ===== ホーム ===== */
  #home{flex-direction:column;align-items:center;justify-content:center;gap:2.2dvh;
    background:var(--sky) url("assets/title-bg.webp") center/cover no-repeat;}
  #home .title{font-size:min(10vw,13dvh);font-weight:900;color:#fff;letter-spacing:.06em;
    text-shadow:6px 6px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink);}
  #home .sub{font-size:min(2.6vw,3.6dvh);font-weight:900;color:#fff;background:rgba(0,0,0,.55);padding:.2em .8em;border:3px solid var(--ink);}
  .home-status{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center;max-width:96vw;}
  .home-status .px-box{white-space:nowrap;padding:.45em .9em;font-weight:900;font-size:min(2vw,3.2dvh);display:flex;align-items:center;gap:.5em;}
  .coin{display:inline-block;width:1.1em;height:1.1em;background:var(--gold);border:3px solid #a0730d;
    box-shadow:inset -3px -3px 0 #d79f12, inset 3px 3px 0 #fff3a8;vertical-align:middle;}
  #btn-battle{font-size:min(4vw,5.6dvh);padding:.4em 2.2em;}
  .home-menu{display:flex;gap:1.2vw;}
  .home-menu .px-btn{font-size:min(2.2vw,3dvh);min-width:8.5em;flex-direction:column;gap:0;white-space:nowrap;line-height:1.2;}
  .home-menu small{font-size:.6em;opacity:.9;}
  .corner{position:absolute;top:2dvh;right:2vw;display:flex;gap:.8vw;}
  .corner-btn{font-size:min(2vw,2.8dvh);min-height:48px;padding:.3em .8em;white-space:nowrap;}
  @media (max-width:1100px){
    .corner{position:static;align-self:flex-end;margin-right:3vw;margin-bottom:-1dvh;}
    .corner-btn{font-size:min(1.7vw,2.6dvh);min-height:36px;padding:.2em .7em;}
  }
  .px-btn.off{background:#5e5e5e;box-shadow:inset -6px -6px 0 #3e3e3e, inset 6px 6px 0 rgba(255,255,255,.2);color:#cfcfcf;}
  .weapon-chip{width:1.8em;height:1.8em;object-fit:contain;image-rendering:pixelated;}
  .home-menu .px-btn.blue{min-width:8.5em;}

  /* ===== そうび・ガチャ 共通 ===== */
  .sub-screen{flex-direction:column;background:#2a1d12;padding:1.2dvh 1.2vw;gap:1.2dvh;}
  .subbar{display:flex;align-items:center;gap:1vw;height:8.5dvh;min-height:52px;}
  .subbar .px-btn{height:100%;min-height:0;padding:0 1.1em;font-size:min(2vw,3dvh);white-space:nowrap;}
  .subbar .spacer{flex:1;}
  .subtitle{color:#fff;font-weight:900;font-size:min(3vw,4.4dvh);text-shadow:3px 3px 0 var(--ink);}
  .coinbox{height:100%;display:flex;align-items:center;gap:.5em;padding:0 1.1em;font-weight:900;font-size:min(2.4vw,3.4dvh);white-space:nowrap;}
  .tabs{display:flex;height:100%;}
  .tab{height:100%;padding:0 1.4em;font-weight:900;font-size:min(2vw,3dvh);background:#6b5a44;color:#e9dcc0;border:var(--px) solid var(--ink);margin-right:-4px;white-space:nowrap;}
  .tab.on{background:var(--paper);color:var(--ink);}
  .tab small{font-size:.6em;}
  .tab:disabled{opacity:.6;}
  .stars{color:#f2a900;letter-spacing:.05em;text-shadow:1px 1px 0 #6b4a00;white-space:nowrap;}
  .r0{--rc:#9d8a6c;} .r1{--rc:#9d9d9d;} .r2{--rc:#4caf3a;} .r3{--rc:#2f6fd6;} .r4{--rc:#a54fd6;} .r5{--rc:#f2a900;}

  /* そうび */
  .equip-main{flex:1;display:flex;gap:1.2vw;min-height:0;}
  .wgrid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:1dvh .8vw;min-height:0;}
  .wcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2dvh;
    background:var(--paper);border:var(--px) solid var(--ink);box-shadow:inset 0 -.8dvh 0 var(--rc);padding:.6dvh .3vw 1.2dvh;min-height:0;overflow:hidden;}
  .wcard img{flex:1;min-height:0;width:100%;object-fit:contain;image-rendering:pixelated;}
  .wcard .wn{font-weight:900;font-size:min(1.45vw,2.1dvh);white-space:nowrap;}
  .wcard .stars{font-size:min(1.3vw,1.9dvh);}
  .wcard .lv{position:absolute;top:.3dvh;left:.3vw;background:var(--ink);color:#fff;font-weight:900;font-size:min(1.2vw,1.7dvh);padding:0 .35em;}
  .wcard.locked{background:#6b5a44;box-shadow:none;}
  .wcard.locked img{filter:brightness(0);opacity:.45;}
  .wcard.locked .wn{color:#d9cbb0;}
  .wcard.equipped{outline:6px solid var(--gold);outline-offset:-10px;background:#fff6c8;}
  .wcard.equipped::after{content:"そうびちゅう";position:absolute;top:.3dvh;right:.3vw;background:#d9531e;color:#fff;font-weight:900;font-size:min(1.1vw,1.6dvh);padding:0 .35em;}
  .wcard.sel{transform:translateY(-3px);}
  .imgfb{flex:1;width:100%;display:flex;align-items:center;justify-content:center;background:var(--rc);color:#fff;font-weight:900;font-size:min(1.4vw,2dvh);text-align:center;}

  .wdetail{flex:0 0 34%;display:flex;flex-direction:column;align-items:center;gap:1.2dvh;padding:2dvh 1.4vw;min-height:0;text-align:center;}
  .wdetail .big{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff 0,#fff 35%,var(--rc) 100%);border:var(--px) solid var(--ink);}
  .wdetail .big img{max-width:90%;max-height:90%;object-fit:contain;image-rendering:pixelated;}
  .wdetail .big{position:relative;overflow:hidden;}
  /* レベルアップ：fx-levelup.png（横6コマ）を武器の上で再生 */
  .fx{position:absolute;left:50%;top:50%;height:110%;aspect-ratio:1;transform:translate(-50%,-50%);overflow:hidden;pointer-events:none;}
  .fx i{position:absolute;left:0;top:0;height:100%;width:600%;background:url("assets/fx-levelup.png") left center/100% 100% no-repeat;
    animation:fx6 .6s steps(6) forwards;}
  @keyframes fx6{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  .lvup{position:absolute;left:0;right:0;top:6%;text-align:center;font-weight:900;font-size:min(3vw,4.4dvh);color:#ffdf4a;
    text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);animation:lvup 1.2s ease-out forwards;pointer-events:none;}
  @keyframes lvup{0%{opacity:0;transform:translateY(30%) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}35%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
  .wdetail .big.pulse img{animation:wpulse .6s ease-out;}
  @keyframes wpulse{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
  .wdetail .locked-big img{filter:brightness(0);opacity:.45;}
  .wdetail h3{font-size:min(2.8vw,4dvh);font-weight:900;}
  .wdetail .stars{font-size:min(2.2vw,3.2dvh);}
  .wdetail .stat{font-weight:900;font-size:min(1.9vw,2.7dvh);line-height:1.5;white-space:nowrap;}
  .wdetail .stat b{font-size:1.3em;color:#d9531e;}
  .wdetail .px-btn{width:100%;font-size:min(2.1vw,3dvh);min-height:64px;flex-direction:column;gap:0;line-height:1.25;white-space:nowrap;}
  .wdetail .px-btn small{font-size:.75em;display:inline-flex;align-items:center;gap:.3em;}
  .wdetail .msg{font-weight:900;font-size:min(1.7vw,2.5dvh);color:#6b5a44;min-height:1.4em;}

  /* ガチャ */
  .gacha-main{flex:1;display:flex;gap:1.2vw;min-height:0;}
  .gacha-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(circle at 50% 55%,#fff6c8 0,#ffd86a 30%,#b97a1d 100%);}
  /* 宝箱（CSSで描くドット風。金のふち・宝石・光） */
  .chest-wrap{position:relative;width:min(30vw,42dvh);aspect-ratio:1.1;display:flex;align-items:flex-end;justify-content:center;}
  .chest-wrap.hide{display:none;}
  .halo{position:absolute;left:-25%;top:-34.5%;width:150%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,236,140,.75) 22%,rgba(255,200,60,0) 62%);animation:halo 2.4s ease-in-out infinite;}
  .chest-wrap.r3 .halo,.chest-wrap.r4 .halo,.chest-wrap.r5 .halo{background:radial-gradient(circle,#fff 0,var(--rc) 28%,rgba(0,0,0,0) 64%);}
  .chest-wrap.r5 .halo{background:conic-gradient(from 0deg,#ff5a5a,#ffd23a,#5ee36a,#4ab3ff,#b56bff,#ff5a5a);
    -webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 62%);mask:radial-gradient(circle,#000 0,#000 25%,transparent 62%);animation:halo 2.4s ease-in-out infinite, spinh 2s linear infinite;}
  @keyframes halo{0%,100%{opacity:.75;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
  @keyframes spinh{to{rotate:360deg}}
  .pedestal{position:absolute;left:4%;right:4%;bottom:0;height:13%;background:#8d8d8d;border:6px solid var(--ink);
    box-shadow:inset 0 -8px 0 #5e5e5e, inset 0 8px 0 #c4c4c4;}
  .pedestal::before{content:"";position:absolute;left:8%;right:8%;top:-38%;height:38%;background:#a9a9a9;border:6px solid var(--ink);border-bottom:none;box-shadow:inset 0 6px 0 #d6d6d6;}
  .chest{position:relative;width:78%;aspect-ratio:1.22;margin-bottom:17%;z-index:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35));}
  .chest-lid{position:absolute;left:0;right:0;top:0;height:42%;z-index:2;border:6px solid var(--ink);border-radius:46% 46% 0 0 / 70% 70% 0 0;
    background:
      linear-gradient(90deg,transparent 15%,#f2c230 15%,#f2c230 23%,transparent 23%,transparent 77%,#f2c230 77%,#f2c230 85%,transparent 85%),
      linear-gradient(#c97a2c,#a35a1c 55%,#86461a);
    box-shadow:inset 0 -10px 0 #e2a72a, inset 0 -16px 0 #7a3f10, inset 0 8px 0 rgba(255,255,255,.25);
    transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.6,1);}
  .chest-body{position:absolute;left:0;right:0;bottom:0;height:61%;border:6px solid var(--ink);
    background:
      radial-gradient(circle at 9% 18%,#fff3a8 0 3%,#e2a72a 3% 6%,transparent 6.5%),
      radial-gradient(circle at 91% 18%,#fff3a8 0 3%,#e2a72a 3% 6%,transparent 6.5%),
      radial-gradient(circle at 9% 82%,#fff3a8 0 3%,#e2a72a 3% 6%,transparent 6.5%),
      radial-gradient(circle at 91% 82%,#fff3a8 0 3%,#e2a72a 3% 6%,transparent 6.5%),
      linear-gradient(90deg,transparent 15%,#f2c230 15%,#f2c230 23%,transparent 23%,transparent 77%,#f2c230 77%,#f2c230 85%,transparent 85%),
      repeating-linear-gradient(#9a5420 0 22%,#7e4216 22% 25%);
    box-shadow:inset 0 10px 0 #e2a72a, inset 0 -10px 0 #e2a72a, inset 10px 0 0 #e2a72a, inset -10px 0 0 #e2a72a, inset 0 16px 0 #6a3410;}
  .chest-lock{position:absolute;left:50%;top:-14%;width:22%;height:46%;transform:translateX(-50%);z-index:3;
    background:linear-gradient(#ffe680,#f2c230 45%,#c98f12);border:5px solid var(--ink);border-radius:18% 18% 40% 40%;
    box-shadow:inset 0 -5px 0 #a8730a, inset 0 4px 0 #fff3b0;}
  .chest-lock::before{content:"";position:absolute;left:50%;top:28%;width:46%;aspect-ratio:1;transform:translateX(-50%) rotate(45deg);
    background:radial-gradient(circle at 35% 35%,#fff 0 12%,#ff6a8a 13% 35%,#d4143c 36% 70%,#8a0a24 71%);border:4px solid var(--ink);animation:gem 1.6s ease-in-out infinite;}
  @keyframes gem{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
  .beam{position:absolute;left:10%;right:10%;bottom:45%;height:0;z-index:1;opacity:0;
    background:linear-gradient(to top,#fff 0,var(--rc,#ffd86a) 35%,rgba(255,255,255,0));clip-path:polygon(18% 100%,82% 100%,100% 0,0 0);}
  .chest.open .beam{animation:beam .5s ease-out forwards;}
  @keyframes beam{from{height:0;opacity:0}to{height:180%;opacity:1}}
  .sparks{position:absolute;inset:0;z-index:2;pointer-events:none;}
  .spark{position:absolute;width:7%;aspect-ratio:1;z-index:2;background:#fff;
    clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 1.8s ease-in-out infinite;}
  .spark:nth-child(1){left:6%;top:14%;animation-delay:0s}
  .spark:nth-child(2){left:84%;top:8%;animation-delay:.5s;width:9%}
  .spark:nth-child(3){left:92%;top:52%;animation-delay:1s;width:5%}
  .spark:nth-child(4){left:0%;top:56%;animation-delay:1.3s;width:6%}
  .spark:nth-child(5){left:46%;top:0%;animation-delay:.8s;width:5%}
  @keyframes twinkle{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
  .chest.shake{animation:cshake .12s 7;}
  .chest.open .chest-lid{transform:translateY(-34%) rotate(-24deg);}
  @keyframes cshake{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-5deg) translateY(-4px)}75%{transform:rotate(5deg) translateY(-4px)}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;}
  .flash.go{animation:flashw .5s ease-out;}
  @keyframes flashw{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
  @keyframes cshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .gacha-result{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1dvh;}
  .gacha-result.show{display:flex;animation:rise .45s ease-out;}
  .gacha-result::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(var(--rc) 0 12deg,transparent 12deg 24deg);opacity:.35;animation:spin 8s linear infinite;z-index:0;}
  .gacha-result > *{position:relative;z-index:1;}
  .gacha-result img{width:min(26vw,36dvh);height:min(26vw,36dvh);object-fit:contain;image-rendering:pixelated;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.35));}
  .gacha-result .imgfb{flex:none;width:min(26vw,36dvh);height:min(26vw,36dvh);}
  .gacha-result .tag{font-weight:900;font-size:min(2.4vw,3.4dvh);background:#d9531e;color:#fff;padding:.1em .8em;border:4px solid var(--ink);}
  .gacha-result .tag.dup{background:#6b5a44;}
  .gacha-result h3{font-weight:900;font-size:min(3.8vw,5.4dvh);color:#fff;text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink);}
  .gacha-result .stars{font-size:min(3vw,4.2dvh);}
  .gacha-result .sub{font-weight:900;font-size:min(2vw,2.9dvh);background:rgba(255,255,255,.85);padding:.2em .8em;border:3px solid var(--ink);}
  @keyframes rise{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  #btn-ticket{font-size:min(2.2vw,3.2dvh);flex-direction:column;gap:.1em;white-space:nowrap;line-height:1.3;}
  #btn-ticket small{font-size:.7em;display:inline-flex;align-items:center;}
  .ticket-ico{display:inline-block;width:1.4em;height:.9em;background:#ff7aa8;border:3px solid var(--ink);vertical-align:middle;
    box-shadow:inset 0 0 0 2px #ffd0e0;margin-right:.3em;}
  .gacha-side{flex:0 0 30%;display:flex;flex-direction:column;gap:1.6dvh;padding:2dvh 1.4vw;}
  #btn-pull{font-size:min(3vw,4.4dvh);line-height:1.3;padding:.5em .6em;}
  #btn-pull{flex-direction:column;gap:.2em;white-space:nowrap;}
  #btn-pull small{font-size:.55em;display:inline-flex;align-items:center;gap:.3em;}
  .rates{display:flex;flex-direction:column;gap:.6dvh;font-weight:900;font-size:min(1.8vw,2.6dvh);}
  .rates div{display:flex;justify-content:space-between;border-bottom:3px dotted #c9b88f;padding-bottom:.3dvh;}
  .note{font-weight:700;font-size:min(1.6vw,2.3dvh);color:#6b5a44;text-align:center;}

  /* ===== バトル ===== */
  #battle{background:#2a1d12;padding:1.2dvh 1.2vw;gap:1.2vw;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:1vw;height:8.5dvh;min-height:48px;}
  .topbar .px-box{height:100%;white-space:nowrap;display:flex;align-items:center;padding:0 .8em;font-weight:900;font-size:min(1.9vw,2.8dvh);}
  .combo{color:#fff;background:#d9531e !important;text-shadow:2px 2px 0 rgba(0,0,0,.4);}
  .combo b{font-size:1.25em;margin-left:.3em;}
  .dice{gap:.5em;color:#6b5a44;}
  .dice.on{color:var(--ink);}
  /* サイコロ（CSSで描く 3×3 の目） */
  .die{--s:1.7em;width:var(--s);height:var(--s);background:#fff;border:3px solid var(--ink);border-radius:18%;
    display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));padding:calc(var(--s) * .08);box-sizing:border-box;box-shadow:inset -3px -3px 0 #d6cfbf;flex:none;}
  .die i{width:calc(var(--s) * .15);height:calc(var(--s) * .15);margin:auto;border-radius:50%;background:var(--ink);visibility:hidden;}
  .die.v1 i:nth-child(5),
  .die.v2 i:nth-child(1),.die.v2 i:nth-child(9),
  .die.v3 i:nth-child(1),.die.v3 i:nth-child(5),.die.v3 i:nth-child(9),
  .die.v4 i:nth-child(1),.die.v4 i:nth-child(3),.die.v4 i:nth-child(7),.die.v4 i:nth-child(9),
  .die.v5 i:nth-child(1),.die.v5 i:nth-child(3),.die.v5 i:nth-child(5),.die.v5 i:nth-child(7),.die.v5 i:nth-child(9),
  .die.v6 i:nth-child(1),.die.v6 i:nth-child(3),.die.v6 i:nth-child(4),.die.v6 i:nth-child(6),.die.v6 i:nth-child(7),.die.v6 i:nth-child(9){visibility:visible;}
  .die.v1 i{background:#d4143c;width:calc(var(--s) * .2);height:calc(var(--s) * .2);}
  .die.v6{background:#fff3a8;}
  .die.blank{background:#efe6d0;border-style:dashed;border-color:#8a7a62;box-shadow:none;}
  /* バトル開始の ダイスロール（アリーナの上） */
  .dice-roll{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2dvh;
    background:rgba(0,0,0,.55);}
  .dice-roll.show{display:flex;}

/* ============================================================
   セーブデータ（localStorage）
   ============================================================ */
const SAVE_KEY = "eigoQuest.v1";
const save = loadSave();
function loadSave(){
  const base = {coins:0, solved:0, correct:0, muted:false, bgmOff:false, owned:{stick:1}, equipped:"stick", tickets:0};
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const s = Object.assign(base, JSON.parse(raw));
      // こわれたデータのまもり
      if(!s.owned || typeof s.owned !== "object") s.owned = {};
      for(const id of Object.keys(s.owned)){
        if(!WMAP[id]) delete s.owned[id];
        else s.owned[id] = Math.max(1, Math.min(MAX_LV, s.owned[id]|0));
      }
      if(!s.owned.stick) s.owned.stick = 1;
      if(!s.owned[s.equipped]) s.equipped = "stick";
      s.tickets = Math.max(0, s.tickets|0);
      return s;
    }
  }catch(e){}
  return base;
}
function weaponAtk(id){ return WMAP[id].atk + ((save.owned[id] || 1) - 1); } // 1レベルごとに+1
function equippedWeapon(){ return WMAP[save.equipped]; }
function writeSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}

/* ============================================================
   こうかおん（WebAudio ビープ）
   ============================================================ */
let actx = null;
function audio(){
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state === "suspended") actx.resume();
  return actx;
}
function beep(seq){
  if(save.muted) return;
  try{
    audio();
    let t = actx.currentTime;
    seq.forEach(([freq, dur, type]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      t += dur * 0.9;
    });
  }catch(e){}
}
const SFX = {
  ok:   () => beep([[660,.08],[880,.08],[1320,.14]]),
  ng:   () => beep([[220,.12,"sawtooth"],[160,.22,"sawtooth"]]),
  hit:  () => beep([[300,.05,"triangle"],[150,.08,"triangle"]]),
  win:  () => beep([[523,.1],[659,.1],[784,.1],[1047,.25]]),
  lose: () => beep([[392,.18,"triangle"],[330,.18,"triangle"],[262,.35,"triangle"]]),
  tap:  () => beep([[880,.04]]),
};

};
const NOTE = {C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
function freqOf(n){ const m = n.match(/^([A-G]#?)(\d)$/); return 440 * Math.pow(2, (NOTE[m[1]] + (+m[2]+1)*12 - 69) / 12); }
function parseTrack(str){
  // ["E5","-","G5",...] → [{f, len}] を 8分音符の位置ごとに
  const t = str.trim().split(/\s+/), out = [];
  t.forEach((tok, i) => {
    if(tok === "-" || tok === ".") return;
    let len = 1; while(t[i+len] === "-") len++;
    out.push({i, f:freqOf(tok), len});
  });
  return {steps:t.length, notes:out};
}
const BGM = (() => {
  let cur = null, want = null, timer = null, gain = null, step = 0, nextT = 0, parsed = {};
  function stop(){
    if(timer){ clearInterval(timer); timer = null; }
    if(gain){ const g = gain; try{ g.gain.setTargetAtTime(0, actx.currentTime, .05); }catch(e){} setTimeout(() => g.disconnect(), 300); gain = null; }
    cur = null;
  }
  function start(name){
    const ctx = audio();
    const song = SONGS[name];
    parsed[name] = parsed[name] || {lead:parseTrack(song.lead), bass:parseTrack(song.bass)};
    const P = parsed[name], dur = 60 / song.bpm / 2;  // 8分音符の秒数
    gain = ctx.createGain(); gain.gain.value = 0.5; gain.connect(ctx.destination);
    const g = gain;
    step = 0; nextT = ctx.currentTime + .08; cur = name;
    const play = (track, type, vol) => (s, t) => {
      track.notes.forEach(n => {
        if(n.i !== s) return;
        const o = ctx.createOscillator(), v = ctx.createGain();
        o.type = type; o.frequency.value = n.f;
        const d = n.len * dur;
        v.gain.setValueAtTime(vol, t); v.gain.setValueAtTime(vol, t + d*.75); v.gain.linearRampToValueAtTime(0.0001, t + d*.95);
        o.connect(v).connect(g); o.start(t); o.stop(t + d);
      });
    };
    const lead = play(P.lead, "square", .045), bass = play(P.bass, "triangle", .09);
    timer = setInterval(() => {
      while(nextT < ctx.currentTime + .25){
        lead(step % P.lead.steps, nextT);
        bass(step % P.bass.steps, nextT);
        step++; nextT += dur;
      }
    }, 60);
  }
  function sync(){
    if(save.bgmOff || !want || !unlocked){ stop(); return; }
    if(cur === want) return;
    stop();
    try{ start(want); }catch(e){}
  }
  let unlocked = false;
  // ブラウザは さいしょのタップまで音を出せないので、そこで開始
  const unlock = () => { unlocked = true; sync(); };
  document.addEventListener("pointerdown", unlock, {once:true});
  document.addEventListener("visibilitychange", () => { if(document.hidden) stop(); else sync(); });
  return { play(name){ want = name; sync(); }, sync };
})();

/* ============================================================

   ※ごほうびのランダムだけに使う（正誤判定・ダメージ計算の乱数には使わない）

const DICE_FACES = {
  1:{text:"コイン 2ばい！",        sub:"かったときの コインが 2ばい"},
  2:{text:"こうげき +1！",         sub:"このバトルの あいだ ずっと"},
  3:{text:"ハート 1つ かいふく！",  sub:"（まんたんなら そのまま）"},

  5:{text:"モンスターの HP -2！",   sub:"（さいてい 1）"},
  6:{text:"大あたり！ ぜんぶのせ！", sub:"1〜5の ボーナスが ぜんぶ！"},
};
function diceFace(el, v){ el.className = el.className.replace(/\bv\d\b|\bblank\b/g, "").trim() + " v" + v; }

function bonusFor(v){
  const all = v === 6;

function applyBonus(b){
  const m = run.monster, got = {...b};

  if(b.hp2){ run.mhp = Math.max(1, m.hp - 2); }
  run.bonus = got;
}

    box.appendChild(h);
  }
}

function askNext(){
  const q = nextQuestion();
  run.q = q; run.busy = false;
  $("feedback").innerHTML = "";
  $("qunit").textContent = q.unit;
  const sen = $("sentence");
  if(q.type === "fill"){
    $("qtype").textContent = "あなうめ";
    sen.classList.remove("jp");
    sen.innerHTML = "<span>" + esc(q.sentence).replace("___", '<span class="blank" id="blank">&nbsp;</span>') + "</span>";
    $("hint").textContent = q.japanese;
  }else{
    $("qtype").textContent = "たんご";
    sen.classList.toggle("jp", q.dir === "je");
    sen.innerHTML = "<span>" + esc(q.sentence) + "</span>";
    $("hint").textContent = q.japanese;
  }
  const box = $("choices");
  box.innerHTML = "";
  shuffle(q.choices).forEach(c => {
    const b = document.createElement("button");
    b.className = "choice" + (q.type === "word" && q.dir === "ej" ? " jp" : "");
    b.textContent = c;
    b.onclick = () => answer(b, c);
    box.appendChild(b);
  });
}

function currentAtk(){
  return weaponAtk(save.equipped) + Math.floor(run.combo / 5) + (run.bonus.atk1 ? 1 : 0); // ぶき＋レベル＋5コンボごとに+1＋ダイス
}

async function answer(btn, choice){
  if(run.busy) return;
  run.busy = true;
  const q = run.q, ok = choice === q.answer;
  const buttons = [...document.querySelectorAll(".choice")];
  buttons.forEach(b => { b.disabled = true; if(b.textContent === q.answer) b.classList.add("ok"); });
  const blank = $("blank");
  if(blank){ blank.textContent = q.answer; blank.classList.add(ok ? "ok" : "ng"); if(!ok) blank.classList.replace("ng","ok"); }

  save.solved++;
  if(ok) save.correct++;
  writeSave();

  if(ok){
    run.combo++;
    run.fightMaxCombo = Math.max(run.fightMaxCombo, run.combo);
    const atk = currentAtk();
    $("feedback").innerHTML = `<span class="ok">せいかい！ ${atk} ダメージ！</span>`;
    SFX.ok();
    await attack(atk);
    renderTop();
    if(run.mhp <= 0){ await wait(400); return winFight(); }
    await wait(700);
    askNext();
  }else{
    btn.classList.add("ng");
    run.combo = 0;
    const loss = run.monster.heartLoss || 1;            // ボスは ハート-2
    const before = run.hearts;
    run.hearts = Math.max(0, run.hearts - loss);
    renderTop();
    SFX.ng();
    const arena = $("arena");
    arena.classList.remove("hurt"); void arena.offsetWidth; arena.classList.add("hurt");
    renderHearts(run.hearts, before);
    if(run.hearts <= 0){
      $("feedback").innerHTML = `<span class="ng">ざんねん… こたえは「${esc(q.answer)}」</span>`;
      await wait(1600);
      return loseRun();
    }
    $("feedback").innerHTML = `<span class="ng">ざんねん… こたえは「${esc(q.answer)}」</span>`;
    await wait(1500); // 正解を見せてから自動で次へ
    askNext();
  }
}

async function attack(atk){
  const slash = $("slash"), arena = $("arena"), dmg = $("dmg");
  slash.innerHTML = wImg(equippedWeapon());
  slash.classList.remove("go"); void slash.offsetWidth; slash.classList.add("go");
  await wait(220);
  SFX.hit();
  arena.classList.remove("hit"); void arena.offsetWidth; arena.classList.add("hit");
  if(run.monster.boss) blinkRed();
  dmg.textContent = "-" + atk;
  dmg.classList.remove("go"); void dmg.offsetWidth; dmg.classList.add("go");
  run.mhp = Math.max(0, run.mhp - atk);
  renderHP();
  await wait(350);
}

function fightReward(){
  // 10〜30枚：のこりハート×2 ＋ この戦いの最大コンボ（10まで）
  const r = 10 + run.hearts * 2 + Math.min(run.fightMaxCombo, 10);
  return Math.max(10, Math.min(30, r));
}

function winFight(){
  stopBossAnim();
  if(run.monster.boss) return winBoss();
  const base = fightReward();
  const reward = run.bonus.coin2 ? base * 2 : base;    // ダイス1・6：コイン2ばい
  run.coins += reward;
  renderTop();
  SFX.win();
  {
    modal("win", `
      <h2>かった！</h2>
      <p>${esc(run.monster.name)}を たおした！</p>
      <div class="big-coin"><span class="coin"></span>+${reward}（こんかい ごうけい ${run.coins}まい）</div>
      ${run.bonus.coin2 ? `<p>うんめいのダイスで コイン 2ばい！（${base}→${reward}）</p>` : ""}
      <p>のこりハート ${run.hearts}　つぎは ${MONSTERS[run.stage+1].boss ? `<b style="color:#d4143c">ボス</b>` : ""}「${esc(MONSTERS[run.stage+1].name)}」</p>
      ${MONSTERS[run.stage+1].boss ? `<p>ボスは まちがえると ハートが 2つ へるよ！</p>` : ""}
      <div class="row">
        <button class="px-btn" data-act="next">つぎのモンスターへ ▶</button>
        <button class="px-btn gray" data-act="bank">ホームへ（コインをもちかえる）</button>
      </div>`);
  }
}

/* ボスに勝ったら：その回のコインは全部持ち帰り、ごほうびは無料券1まい（ダイス1・6なら2まい）。コインは出さない */
function winBoss(){
  bankCoins(run.coins);
  const tix = run.bonus.coin2 ? 2 : 1;                 // ダイス1・6：むりょうけん 2まい
  save.tickets = (save.tickets|0) + tix;
  writeSave();
  SFX.win();
  modal("win", `
    <h2>ボスを たおした！</h2>
    <p>${esc(run.monster.name)}を たおした！ ぜんぶ クリア！</p>
    <div class="big-coin"><span class="ticket-ico"></span>ガチャ むりょうけん ×${tix} ゲット！</div>
    ${tix > 1 ? `<p>うんめいのダイスで ごほうびが 2ばい！</p>` : ""}
    <p>こんかいの コイン ${run.coins}まいも ぜんぶ もちかえったよ！</p>
    <div class="row"><button class="px-btn" data-act="home">ホームへ</button></div>`);
}

function loseRun(){
  stopBossAnim();
  const keep = Math.floor(run.coins / 2);
  bankCoins(keep);
  SFX.lose();
  modal("lose", `
    <h2>まけちゃった…</h2>
    <p>ハートが なくなった。</p>
    <div class="big-coin"><span class="coin"></span>${run.coins}まいの はんぶん → ${keep}まい もちかえり</div>
    <div class="row"><button class="px-btn" data-act="home">ホームへ</button></div>`);
}

function bankCoins(n){ save.coins += n; writeSave(); }

function modal(kind, html){
  const box = $("modal-box");
  box.className = "px-box " + kind;
  box.innerHTML = html;
  $("modal").classList.add("active");
  box.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    SFX.tap();
    $("modal").classList.remove("active");
    const act = b.dataset.act;
    if(act === "next"){ run.stage++; startFight(); }
    else if(act === "bank"){ bankCoins(run.coins); stopBossAnim(); renderHome(); }
    else renderHome();
  });
}

/* にげる：コインははんぶん（まけと同じあつかい）*/
$("btn-quit").onclick = () => {
  if(run.busy) return;
  if($("modal").classList.contains("active")) return;
  SFX.tap();
  const keep = Math.floor(run.coins / 2);
  modal("lose", `
    <h2>にげる？</h2>
    <p>にげると こんかいの コインは はんぶん（${keep}まい）に なるよ。</p>
    <div class="row">
      <button class="px-btn gray" data-act="stay">たたかう</button>
      <button class="px-btn blue" data-act="flee">にげる</button>
    </div>`);
  $("modal-box").querySelector('[data-act="stay"]').onclick = () => { SFX.tap(); $("modal").classList.remove("active"); };
  $("modal-box").querySelector('[data-act="flee"]').onclick = () => { SFX.tap(); $("modal").classList.remove("active"); bankCoins(keep); stopBossAnim(); renderHome(); };
};

/* 画像の先読み */
[...MONSTERS, ...WEAPONS].forEach(m => { const i = new Image(); i.src = m.img; });
MONSTERS.filter(m => m.sprites).flatMap(m => m.sprites).concat(["assets/fx-levelup.png"]).forEach(src => { const i = new Image(); i.src = src; });

renderHome();
})();
</script>
</body>
</html>
